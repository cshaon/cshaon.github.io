short_bio: >-
  <p>
    Hello! I am a PhD student at the <a href="https://www2.thphy.uni-duesseldorf.de/index.php" target="_blank">Institut für Theoretische Physik II: Soft Matter, Heinrich-Heine-Universität Düsseldorf</a> working with <a href="https://scholar.google.com/citations?user=jiw3aksAAAAJ&amp;hl=de" target="_blank">Dr. Jürgen Horbach</a>.
    My research broadly focuses on understanding the physics of supercooled liquids and glasses, with a particular interest in their rheological and mechanical properties. I am also interested in systems that break the symmetries typically associated with equilibrium physics, including active matter, metamaterials, and biological systems. In particular, I am interested in developing theoretical and computational frameworks to understand these systems through the lens of concepts and theories developed for glasses and disordered materials.
  </p>
  <p>
    Previously, I worked as a research assistant in the soft condensed matter group at the <a href="https://www.rri.res.in/" target="_blank">Raman Research Institute</a>, Bangalore, where I studied the effects of emergent non-reciprocity in a variety of physical systems with <a href="https://scholar.google.com/citations?hl=en&amp;user=ObZopO8AAAAJ&amp;view_op=list_works&amp;sortby=pubdate" target="_blank">Dr. Rituparno Mandal</a>.
  </p>

